<!doctype html><html lang="ru"><meta charset="utf-8"><title>Vivaldi · проверка редакции</title><style>body{background:#211b22;color:#eee0ce;font:14px sans-serif}button{padding:12px}iframe{display:block;border:0;margin:20px auto;background:#120f14}pre{white-space:pre-wrap}</style><button id="run">Проверить три размера</button><pre id="result"></pre><iframe id="site" title="Проверяемый сайт" src="../index.html?qa=1"></iframe><script>
const f=document.querySelector('#site'),out=document.querySelector('#result');const frame=()=>new Promise(r=>f.contentWindow.requestAnimationFrame(()=>f.contentWindow.requestAnimationFrame(r)));
document.querySelector('#run').onclick=async()=>{const rows=[],failures=[];for(const [width,height] of [[390,844],[820,1180],[1440,900]]){f.style.width=width+'px';f.style.height=height+'px';await new Promise(r=>setTimeout(r,200));const d=f.contentDocument,w=f.contentWindow;for(const e of d.querySelectorAll('.episode')){w.scrollTo({top:e.offsetTop+(e.offsetHeight-e.querySelector('.stage').offsetHeight)*.35,behavior:'instant'});await frame();const sr=e.querySelector('.stage').getBoundingClientRect(),bad=[];for(const el of e.querySelectorAll('.copy h2,.copy p,.scene-note,.credits')){if(w.getComputedStyle(el).visibility==='hidden')continue;const r=el.getBoundingClientRect();if(r.left<0||r.right>width+1||r.top<sr.top-1||r.bottom>sr.bottom+1)bad.push(el.tagName+'.'+el.className)}const r={size:width+'×'+height,scene:e.dataset.episode,active:d.documentElement.dataset.storyScene,event:d.documentElement.dataset.storyEvent,overflow:d.documentElement.scrollWidth-width,bad};rows.push(r);if(r.active!==r.scene||r.overflow>0||bad.length)failures.push(r)}
 const events=['birth','pieta','europe','seasons','last','archive'];for(const id of events){const target=d.querySelector((width<1024?'.mobile-history-list':'.history')+' button[data-event="'+id+'"]');if(width<1024)d.querySelector('.mobile-history-toggle').click();target.click();await new Promise(r=>setTimeout(r,1100));await frame();const r={size:width+'×'+height,click:id,active:d.documentElement.dataset.storyEvent,scene:d.documentElement.dataset.storyScene};rows.push(r);if(r.active!==id)failures.push(r)} }
out.textContent=JSON.stringify({checks:rows.length,failures,rows},null,2)};
</script></html>
